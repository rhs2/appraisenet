[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appraisenet"
version = "0.1.0"
description = "AppraiseNet: calibrated used-vehicle price estimation - classical, deep and hybrid learners compared under the AppraiseNet Evaluation Protocol, with a production learning loop."
authors = [{name = "Rakibul Hasan Sium"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "catboost>=1.2",
  "torch>=2.0",
  "pyyaml",
  "python-dotenv",
  "matplotlib",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
]

[project.optional-dependencies]
tracking = ["mlflow-skinny>=2.9"]
postgres = ["sqlalchemy>=2", "psycopg2-binary"]
dev = ["pytest", "ruff", "httpx"]

[project.scripts]
appraisenet = "appraisenet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
